 [workspace]
resolver = "2"
  members = [
    "crates/common",
    "crates/core",
    "crates/provider",
    "crates/tools",
    "crates/server",
    "crates/cli",
    "crates/cli-core",
    "crates/tui",
    "crates/client",
  ]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
config = "0.13"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
clap = { version = "4.4", features = ["derive", "env"] }
futures = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"
bytes = "1.5"
chrono = "0.4"

# Mocking
mockall = "0.12"

 # Internal dependencies
common = { path = "crates/common" }
tools = { path = "crates/tools" }
provider = { path = "crates/provider" }
sisyphus_core = { path = "crates/core" }
client = { path = "crates/client", package = "sisyphus_client" }
 sisyphus_cli_core = { path = "crates/cli-core", package = "sisyphus-cli-core" }
 tui = { path = "crates/tui" }

[workspace.metadata.tarpaulin]
# Output directory for coverage reports
out-dir = "target/tarpaulin"


