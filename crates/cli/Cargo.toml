[package]
name = "sisyphus"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sisyphus"
path = "src/main.rs"

[dependencies]
sisyphus_cli_core = { path = "../cli-core", package = "sisyphus-cli-core" }
common = { workspace = true }
sisyphus_core = { workspace = true }
provider = { workspace = true }
tools = { workspace = true }
server = { path = "../server" }
client = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dotenv = "0.15"
rust-i18n = "3"
reqwest-eventsource = "0.6"
futures = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
colored = "2.0"
reedline = "0.28"
tui = { workspace = true, optional = true }
async-trait.workspace = true

[features]
default = []
tui = ["dep:tui"]
dev_debug = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
